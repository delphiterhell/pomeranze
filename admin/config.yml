backend:
  name: git-gateway
  branch: restyling

media_folder: "images"
public_folder: "/images"

locale: it

collections:
  - name: "workshop"
    label: "Workshop"
    folder: "content/workshop"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Orario", name: "orario", widget: "string", hint: "Es. 10:00–13:00 oppure 'da definire'" }
      - { label: "Costo", name: "costo", widget: "string", hint: "Es. 45 €" }
      - { label: "Max partecipanti", name: "maxPartecipanti", widget: "number" }
      - { label: "Posti rimasti", name: "postiRimasti", widget: "number", default: 0 }
      - label: "Stato"
        name: "stato"
        widget: "select"
        options:
          - { label: "Disponibile", value: "disponibile" }
          - { label: "Lista d'attesa", value: "lista-attesa" }
          - { label: "Sold out", value: "sold-out" }
      - label: "Stagione"
        name: "stagione"
        widget: "select"
        options:
          - "Estate 2025"
          - "Autunno 2025"
          - "Inverno 2025-2026"
          - "Primavera 2026"
          - "Estate 2026"
          - "Autunno 2026"
          - "Inverno 2026-2027"
          - "Primavera 2027"
          - "Estate 2027"
          - "Autunno 2027"
      - { label: "Descrizione", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }

  - name: "blog"
    label: "Articoli"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Immagine di copertina", name: "coverImage", widget: "image", required: false }
      - { label: "Estratto / Anteprima", name: "excerpt", widget: "text", hint: "Breve descrizione mostrata nella lista del blog (1-2 frasi)" }
      - label: "Categoria"
        name: "tags"
        widget: "select"
        multiple: true
        options: ["Consigli", "Coltivazione", "Vita nel campo", "Stagioni", "Natura", "Workshop"]
      - { label: "Testo dell'articolo", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "post.njk" }
